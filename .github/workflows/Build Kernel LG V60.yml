name: Build Kernel LG V60

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核源码分支 (Resukisu-LG_V60)'
        required: true
        default: lineage-23.2
        type: choice
        options:
          - lineage-23.2
          - lineage-23.0
          - lineage-22.2
      suffix:
        description: '自定义内核后缀（-1 关闭；留空按时间戳）'
        required: false
        default: ''
        type: string
      zram:
        description: 'ZRAM (0关闭/1开启)/算法名/大小'
        required: true
        default: '1/lz4/4294967296'
        type: string
      kernel_date:
        description: '按日期回退内核源码 (YYYY-MM-DD，留空最新)'
        required: false
        default: ''
        type: string
      build_time:
        description: '自定义构建时间 (F=UTCT 或 -1 关闭)'
        required: false
        default: ''
        type: string
      ksu_meta:
        description: '管理器分支名/内置分支名/自定义版本标识/回退分支hash'
        required: false
        default: 'main/main//'
        type: string
      netfilter:
        description: '启用网络功能拓展 (NETFILTER)？'
        required: true
        type: boolean
        default: true
      unicode_bypass:
        description: '添加 Unicode 不可见字码点漏洞修复补丁？'
        required: true
        type: boolean
        default: true
      kpm:
        description: 'KernelPatch (KPM) 支持'
        required: true
        type: boolean
        default: true


concurrency:
  group: lgv60-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: LG V60 (${{ inputs.kernel_branch }} KSU${{ inputs.suffix && format(' {0}', inputs.suffix) || '' }})
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 5G
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KERNEL_REPO: https://github.com/wTNTw/Resukisu-LG_V60.git
      ANY_KERNEL_REPO: https://github.com/kiy017/AnyKernel3.git

    steps:
      - name: Checkout Action-Build (this repo)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

      - name: Download and Extract Android NDK
        run: |
          curl -LO https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip "android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/*"
          mkdir -p "$HOME/toolchain"
          mv android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/* "$HOME/toolchain/"
          rm -rf android-ndk-r27c-linux.zip android-ndk-r27c
          echo "$HOME/toolchain/bin" >> "$GITHUB_PATH"

      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: lgv60-ccache-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            lgv60-ccache-${{ inputs.kernel_branch }}-
            lgv60-ccache-

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 --single-branch --branch "${{ inputs.kernel_branch }}" "$KERNEL_REPO" kernel
          cd kernel
          git log -1 --format="kernel HEAD: %H %s"

      - name: Rollback Kernel Source by Date
        if: ${{ inputs.kernel_date != '' }}
        working-directory: kernel
        env:
          KERNEL_DATE: ${{ inputs.kernel_date }}
        run: |
          if [[ ! "$KERNEL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "❌ KERNEL_DATE 格式错误，应为 YYYY-MM-DD"
            exit 1
          fi
          git fetch --unshallow origin 2>/dev/null || echo "⚠️ unshallow 失败，可能无法按日期回退"
          COMMIT=$(git log --before="${KERNEL_DATE} 23:59:59" -1 --format=%H)
          if [ -z "$COMMIT" ]; then
            echo "❌ 未找到 ${KERNEL_DATE} 前的 commit"
            exit 1
          fi
          git checkout -q "$COMMIT"
          git log -1 --format="kernel HEAD: %H %s"

      - name: Apply UNICODE_BYPASS
        if: inputs.unicode_bypass == true
        working-directory: kernel
        run: |
          PATCH="${{ github.workspace }}/patches/unicode_bypass_fix_6.1-.patch"
          if [ -f "$PATCH" ]; then
            patch -p1 --forward < "$PATCH" || echo "⚠️ patch 应用失败（可能已应用），继续"
            echo "UNICODE_BYPASS applied"
          else
            echo "⚠️ 未找到 unicode_bypass_fix_6.1-.patch，跳过"
          fi

      - name: Inject ReSukiSU (KernelSU via KSU_META)
        working-directory: kernel
        run: |
          KSU_META="${{ inputs.ksu_meta }}"
          IFS='/' read -r KSU_MANAGER_BRANCH KSU_BUILTIN_BRANCH KSU_CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          echo "manager branch: ${KSU_MANAGER_BRANCH:-main}, builtin branch: ${KSU_BUILTIN_BRANCH:-main}"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${KSU_MANAGER_BRANCH:-main}/kernel/setup.sh" | bash -s "${KSU_BUILTIN_BRANCH:-main}"
          if [ -n "$MANUAL_HASH" ]; then
            cd KernelSU
            if git checkout "$MANUAL_HASH" 2>/dev/null; then
              echo "KSU 回退到 $MANUAL_HASH"
            else
              echo "⚠️ 无法 checkout $MANUAL_HASH，保持当前版本"
            fi
            cd ..
          fi
          if [ -n "$KSU_CUSTOM_TAG" ]; then
            echo "custom version tag: $KSU_CUSTOM_TAG"
          fi

      - name: Fix KSU su-session fd scope (Android 16 boot)
        working-directory: kernel
        run: |
          # ------------------------------------------------------------
          # ReSukiSU 从 bprm_committed_creds LSM 钩子给每个 exec 的进程安装
          # [ksu_driver_su] 匿名 inode fd（fd 3）。源码里唯一的保护是
          # CONFIG_KSU_MANUAL_HOOK，而本流程用 KSU_SUSFS hook 模式（Kconfig 里
          # TRACEPOINT/MANUAL/SUSFS 三者互斥），保护被编译掉，fd 3 因此落到每一个
          # 进程，包括 zygote64。
          #
          # Android 16 的 zygote 在 forkSystemServer 时校验所有 fd 的 st_mode，
          # 该匿名 inode 没有 S_IFMT 类型位，直接 abort：
          #   JNI FatalError called: (system_server) Unsupported st_mode for FD 3: Unknown
          # 结果 zygote 崩溃循环、system_server 起不来、卡在开机动画。
          #
          # 修复：为 SUSFS 模式补上 TIF_PROC_IN_KSU_EXECVE（arm64 bit 61，本内核空闲：
          # 内核自身用 0-26、SUSFS 用 33-35、KSU 用 63），让只有执行过 su -> ksud
          # 的线程拿到该 scoped fd。
          # ------------------------------------------------------------
          python3 - <<'KSU_FD_SCOPE_PATCH'
          import pathlib
          import sys

          EDITS = [
              (
                  "sucompat.h: define TIF_PROC_IN_KSU_EXECVE for the SUSFS hook mode",
                  "KernelSU/kernel/feature/sucompat.h",
                  """#define ksu_clear_current_proc_unprivillege susfs_clear_current_proc_no_su
          #else // manual hook""",
                  """#define ksu_clear_current_proc_unprivillege susfs_clear_current_proc_no_su

          // Spare arm64 TIF bits here are 27-62: the kernel itself uses 0-26, SUSFS uses
          // 33-35 and KSU uses 63 for TIF_KSU_DISABLE_ESCAPE_WITH_ROOT.
          // This flag records that the current thread exec'd su and was rewritten to ksud,
          // so that only that process receives the scoped su-session driver fd.
          #ifdef CONFIG_64BIT
          #define TIF_PROC_IN_KSU_EXECVE 61
          #else
          #define TIF_PROC_IN_KSU_EXECVE 29
          #endif
          #else // manual hook""",
              ),
              (
                  "sucompat.c: set the flag when su is rewritten to ksud",
                  "KernelSU/kernel/feature/sucompat.c",
                  """#ifdef CONFIG_KSU_MANUAL_HOOK
              // flag for post execve hook, mostly: bprm_committed_creds LSM hooks
              // no need care in susfs, susfs completed everything
              set_thread_flag(TIF_PROC_IN_KSU_EXECVE);
          #endif""",
                  """#if defined(CONFIG_KSU_SUSFS) || defined(CONFIG_KSU_MANUAL_HOOK)
              // flag for post execve hook, mostly: bprm_committed_creds LSM hooks
              // Remember that this thread exec'd su and was rewritten to ksud, so only
              // this process may receive the scoped su-session fd afterwards.
              set_thread_flag(TIF_PROC_IN_KSU_EXECVE);
          #endif""",
              ),
              (
                  "sucompat.c: only install the scoped fd for that process",
                  "KernelSU/kernel/feature/sucompat.c",
                  """int ksu_handle_post_execve(int *fd, const char *filename, void *argv, void *envp, int *flags, int *retval)
          {
          #ifdef CONFIG_KSU_MANUAL_HOOK
              if (likely(!test_thread_flag(TIF_PROC_IN_KSU_EXECVE))) {
                  return -EINVAL;
              }
          #endif""",
                  """int ksu_handle_post_execve(int *fd, const char *filename, void *argv, void *envp, int *flags, int *retval)
          {
          #if defined(CONFIG_KSU_SUSFS) || defined(CONFIG_KSU_MANUAL_HOOK)
              // bprm_committed_creds runs for every exec. Only the process that just
              // exec'd su -> ksud may hold the scoped su-session fd; every other process
              // must keep fd 3 free, because Android 16 zygote validates all fds when it
              // forks system_server and aborts on this anon inode's st_mode.
              if (likely(!test_thread_flag(TIF_PROC_IN_KSU_EXECVE))) {
                  return -EINVAL;
              }
          #endif""",
              ),
          ]


          root = pathlib.Path(".")
          sources = {}

          for name, rel, old, new in EDITS:
              path = root / rel
              if not path.is_file():
                  print("error: %s not found" % path, file=sys.stderr)
                  sys.exit(1)

              if rel not in sources:
                  sources[rel] = path.read_text(encoding="utf-8")
              src = sources[rel]

              if new in src:
                  print("already applied: %s" % name)
                  continue

              count = src.count(old)
              if count != 1:
                  print("error: anchor for '%s' matched %d times (expected 1) in %s" % (name, count, rel), file=sys.stderr)
                  sys.exit(1)

              sources[rel] = src.replace(old, new, 1)
              print("applied: %s" % name)

          for rel, src in sources.items():
              (root / rel).write_text(src, encoding="utf-8")

          print("Android 16 su-session fd scope fix applied")
          KSU_FD_SCOPE_PATCH

      - name: Configure Kernel
        working-directory: kernel
        env:
          KSU_ENABLE: 'true'
          SUSFS_ENABLE: 'true'
          NETFILTER: ${{ inputs.netfilter }}
          ZRAM: ${{ inputs.zram }}
        run: |
          make ARCH=arm64 O=out timelm_defconfig

          if [ "$KSU_ENABLE" == "true" ]; then
            scripts/config --file out/.config \
              -e KSU \
              -e THREAD_INFO_IN_TASK \
              -e KPM \
              -e TMPFS_XATTR \
              -e TMPFS_POSIX_ACL
            if [ "$SUSFS_ENABLE" == "true" ]; then
              scripts/config --file out/.config \
                -e KSU_SUSFS \
                -e KSU_SUSFS_SUS_PATH \
                -e KSU_SUSFS_SUS_MOUNT \
                -e KSU_SUSFS_SUS_KSTAT \
                -e KSU_SUSFS_SUS_KSTAT_REDIRECT \
                -e KSU_SUSFS_SPOOF_UNAME \
                -e KSU_SUSFS_ENABLE_LOG \
                -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                -e KSU_SUSFS_OPEN_REDIRECT \
                -e KSU_SUSFS_SUS_MAP \
                -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
                -e KSU_MULTI_MANAGER_SUPPORT \
                -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            fi
          fi

          # droid_spaces 已于 2026-09-10 移除：它要求的 SYSVIPC / POSIX_MQUEUE 会改
          # struct task_struct / nsproxy 布局，实测令 710 / 577 个 stock 导出符号 CRC
          # 与官方 ROM 不一致，/vendor 预编译模块全部拒载（WiFi、音频消失）。
          # 需要时见 Action-Build dev 分支 docs/LG_V60_FEATURES_AND_ABI.md，按其中
          # 的 scripts/config 行手动加回；仅 PID_NS / USER_NS / DEVTMPFS /
          # NETFILTER_XT_MATCH_RECENT 是实测 ABI 中性的，可安全打开。

          if [ "$NETFILTER" == "true" ]; then
            scripts/config --file out/.config \
              -e NETFILTER_XT_MATCH_ADDRTYPE \
              -e NETFILTER_XT_SET \
              -e IP_SET \
              -e IP_SET_MAX \
              -e IP_SET_BITMAP_IP \
              -e IP_SET_BITMAP_IPMAC \
              -e IP_SET_BITMAP_PORT \
              -e IP_SET_HASH_IP \
              -e IP_SET_HASH_IPMARK \
              -e IP_SET_HASH_IPPORT \
              -e IP_SET_HASH_IPPORTIP \
              -e IP_SET_HASH_IPPORTNET \
              -e IP_SET_HASH_IPMAC \
              -e IP_SET_HASH_MAC \
              -e IP_SET_HASH_NETPORTNET \
              -e IP_SET_HASH_NET \
              -e IP_SET_HASH_NETNET \
              -e IP_SET_HASH_NETPORT \
              -e IP_SET_HASH_NETIFACE \
              -e IP_SET_LIST_SET \
              -e IP6_NF_NAT \
              -e IP6_NF_TARGET_MASQUERADE \
              -e NETFILTER_XT_TARGET_HL \
              -e IP_NF_TARGET_TTL \
              -e IP6_NF_TARGET_HL \
              -e NETFILTER_XT_MATCH_HL \
              -e IP_NF_MATCH_TTL \
              -e IP6_NF_MATCH_HL \
              -e IP_NF_MANGLE \
              -e IP6_NF_MANGLE
            scripts/config --file out/.config --set-val IP_SET_MAX 65534
          fi

          if [ -n "$ZRAM" ]; then
            IFS='/' read -r ZRAM_SW ZRAM_ALGO ZRAM_SIZE <<< "$ZRAM"
            if [ "$ZRAM_SW" == "1" ]; then
              echo "ZRAM enabled (algo=$ZRAM_ALGO size=$ZRAM_SIZE)"
              scripts/config --file out/.config \
                -e ZRAM \
                -e ZRAM_WRITEBACK \
                -e ZRAM_MEMORY_TRACKING \
                -e CRYPTO_LZ4 \
                -e CRYPTO_LZ4HC \
                -e CRYPTO_LZO \
                -e CRYPTO_ZSTD
            fi
          fi

          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KPM|CONFIG_ZRAM|CONFIG_USER_NS|CONFIG_NAMESPACES|CONFIG_IP_SET|CONFIG_NETFILTER_XT_MATCH_ADDRTYPE" out/.config

      - name: Pin Kernel Release To Stock String
        working-directory: kernel
        run: |
          # ------------------------------------------------------------
          # 官方内核 release: 4.19.325-cip133-st17-perf-g29902cf733dc
          #
          # 注意：release 段并不决定模块能否加载。CONFIG_MODVERSIONS=y 时
          # kernel/module.c 的 same_magic() 会跳过第一个空格之前的内容，只比较
          # flags（SMP preempt mod_unload modversions aarch64），真正把关的是符号
          # CRC。设备实测：vermagic 仍带 -cip133-st17-perf-g29902cf733dc 的 /vendor
          # 模块，在 release 只有 4.19.325 的内核上 insmod 返回 0。
          # 所以这里只是让 uname -r 与官方一致（部分 ROM 组件/App 会看这个）。
          #
          # scripts/setlocalversion 才是拼接 localversion 的地方（脚本自身
          # ${CONFIG_LOCALVERSION}${LOCALVERSION} 一行），它还会追加 -g<hash> /
          # -dirty。所以给它固定输出，而不是依赖 localversion* 文件与 git describe。
          # CONFIG_MODVERSIONS 保持不动：必须与官方模块的 flags 一致。
          # ------------------------------------------------------------
          echo "=========================================="
          echo "Pinning kernel release to the stock one"
          echo "Target: 4.19.325-cip133-st17-perf-g29902cf733dc"
          echo "=========================================="
          rm -f localversion localversion-cip localversion-st
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "" --disable CONFIG_LOCALVERSION_AUTO
          if [ -f scripts/setlocalversion ] && [ ! -f scripts/setlocalversion.orig ]; then
            cp scripts/setlocalversion scripts/setlocalversion.orig
          fi
          cat > scripts/setlocalversion <<'SLVEOF'
          #!/bin/sh
          # Fixed output so KERNELRELEASE matches the stock release exactly
          echo "-cip133-st17-perf-g29902cf733dc"
          SLVEOF
          chmod +x scripts/setlocalversion
          echo "OK: kernel release pinned to 4.19.325-cip133-st17-perf-g29902cf733dc"

      - name: Build Kernel
        working-directory: kernel
        env:
          BUILD_TIME: ${{ inputs.build_time }}
        run: |
          export KBUILD_BUILD_USER=kiyomi
          export KBUILD_BUILD_HOST=yuki
          if [ -n "$BUILD_TIME" ] && [ "$BUILD_TIME" != "-1" ]; then
            if [ "$BUILD_TIME" = "F" ]; then
              export KBUILD_BUILD_TIMESTAMP=$(date -u +"%a %b %e %H:%M:%S UTC %Y")
            else
              export KBUILD_BUILD_TIMESTAMP="$BUILD_TIME"
            fi
            echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
          fi
          make -j$(nproc) \
            ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang HOSTCC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          test -f out/arch/arm64/boot/Image && echo "Image OK" || { echo "Image missing"; exit 1; }

      - name: Patch Kernel For KPM Support
        if: inputs.kpm == true
        working-directory: kernel/out/arch/arm64/boot
        run: |
          wget https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          echo "KPM patch applied"

      - name: Generate Image-dtb and Collect Modules
        working-directory: kernel
        run: |
          # Image-dtb
          if [ ! -f "out/arch/arm64/boot/Image.gz" ] && [ -f "out/arch/arm64/boot/Image" ]; then
            cat out/arch/arm64/boot/Image $(find out/arch/arm64/boot/dts/ -name "*.dtb") > out/arch/arm64/boot/Image-dtb
            echo "Image-dtb generated"
          fi

          # dtb aggregate
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > out/arch/arm64/boot/dtb

          # Modules 平铺整理（对齐原 build.sh 行为）
          if grep -q "CONFIG_MODULES=y" "out/.config"; then
            MODULES_OUT="$(pwd)/out/modules_out"
            rm -rf "$MODULES_OUT"
            make -j$(nproc) ARCH=arm64 SUBARCH=arm64 O=out \
              CC=clang HOSTCC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
              LD=ld.lld AR=llvm-ar NM=llvm-nm \
              OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
              INSTALL_MOD_PATH="$MODULES_OUT" modules_install

            TARGET_KV_DIR=$(find "$MODULES_OUT/lib/modules" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            FLAT_STAGE="$MODULES_OUT/flat_modules"
            mkdir -p "$FLAT_STAGE"

            # 音频模块
            find "$TARGET_KV_DIR/kernel/techpack/audio" -name "*.ko" 2>/dev/null | while read -r audio_mod; do
              base_name=$(basename "$audio_mod" ".ko")
              if [ "$base_name" = "machine_dlkm" ]; then
                cp "$audio_mod" "$FLAT_STAGE/audio_machine_kona.ko"
              else
                clean_name=$(echo "$base_name" | sed 's/_dlkm//')
                cp "$audio_mod" "$FLAT_STAGE/audio_${clean_name}.ko"
              fi
            done

            # WiFi 模块
            if [ -f "$TARGET_KV_DIR/kernel/drivers/staging/qcacld-3.0/wlan.ko" ]; then
              cp "$TARGET_KV_DIR/kernel/drivers/staging/qcacld-3.0/wlan.ko" "$FLAT_STAGE/qca_cld3_qca6390.ko"
            fi

            # 其余模块（含 zram.ko 等）
            find "$TARGET_KV_DIR/kernel" -name "*.ko" ! -path "*qcacld-3.0*" ! -path "*techpack/audio*" | while read -r misc_mod; do
              cp "$misc_mod" "$FLAT_STAGE/$(basename "$misc_mod")"
            done

            rm -rf "$TARGET_KV_DIR/kernel"
            rm -f "$TARGET_KV_DIR"/source "$TARGET_KV_DIR"/build
            mv "$FLAT_STAGE"/* "$TARGET_KV_DIR/"
            rm -rf "$FLAT_STAGE"
            find "$TARGET_KV_DIR" -name "*.ko" -type f -exec chmod 644 {} +

            cp "${{ github.workspace }}/modules.dep.static" "$TARGET_KV_DIR/modules.dep"
            touch "$TARGET_KV_DIR/modules.alias" "$TARGET_KV_DIR/modules.softdep"
            echo "MODULES_DIR=$TARGET_KV_DIR" >> "$GITHUB_ENV"
          fi

      - name: Pack AnyKernel3
        run: |
          git clone "$ANY_KERNEL_REPO" -b master --single-branch --depth=1 anykernel
          cp kernel/out/arch/arm64/boot/Image-dtb anykernel/
          cp kernel/out/arch/arm64/boot/dtb anykernel/
          if [ -n "$MODULES_DIR" ] && [ -d "$MODULES_DIR" ]; then
            cp -r "$MODULES_DIR"/* anykernel/modules/vendor/lib/modules/
            chmod 644 anykernel/modules/vendor/lib/modules/*
            # 同时把模块放进 boot ramdisk 的 /lib/modules。
            # AnyKernel3 的 repack_ramdisk() 会把 anykernel/ramdisk/ 打包进新的
            # boot ramdisk，这样随内核一起编译的模块（vermagic 与 MODVERSIONS
            # CRC 都与新内核匹配）必定可用，不依赖 vendor 分区被替换。
            echo "Placing modules into boot ramdisk /lib/modules..."
            mkdir -p anykernel/ramdisk/lib/modules
            cp -f "$MODULES_DIR"/*.ko anykernel/ramdisk/lib/modules/
            chmod 644 anykernel/ramdisk/lib/modules/*.ko
            sed 's|/vendor/lib/modules/||g' "$MODULES_DIR/modules.dep" > anykernel/ramdisk/lib/modules/modules.dep
            cp -f "$MODULES_DIR"/modules.alias "$MODULES_DIR"/modules.softdep anykernel/ramdisk/lib/modules/ 2>/dev/null || true
            echo "ramdisk modules: $(ls anykernel/ramdisk/lib/modules/*.ko | wc -l)"
          fi

          KSU_STR="ReSukiSU-SuSFS"
          FLAGS=""
          SUFFIX_PART=""
          if [ -n "${{ inputs.suffix }}" ] && [ "${{ inputs.suffix }}" != "-1" ]; then
            SUFFIX_PART="_${{ inputs.suffix }}"
          fi
          ZIP_FILENAME="resukisu_timelm_${KSU_STR}${FLAGS}${SUFFIX_PART}_$(date +'%Y%m%d_%H%M%S')_anykernel3.zip"

          cd anykernel
          zip -r9 "$ZIP_FILENAME" ./* -x .git .gitignore out/ ./*.zip
          mv "$ZIP_FILENAME" ..
          cd ..
          echo "ZIP_FILE=$ZIP_FILENAME" >> "$GITHUB_ENV"
          echo "zip: $ZIP_FILENAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ZIP_FILE }}
          path: ${{ env.ZIP_FILE }}
          if-no-files-found: error

      - name: Publish to Telegram
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZIP_FILE: ${{ env.ZIP_FILE }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KSU_ENABLED: 'true'
          SUSFS_ENABLED: 'true'
          KPM_ENABLED: ${{ inputs.kpm }}
          ZRAM: ${{ inputs.zram }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM secrets not set. Skipping."
            exit 0
          fi
          if [ ! -f "$ZIP_FILE" ]; then
            echo "zip not found: $ZIP_FILE"
            exit 0
          fi

          escape_mdv2() {
            printf '%s' "$1" | perl -pe 's{([_*\[\]()~`>#+=|{}.!-])}{\\$1}g'
          }

          ESC_FILE=$(escape_mdv2 "${ZIP_FILE}")
          ESC_BRANCH=$(escape_mdv2 "${KERNEL_BRANCH}")
          ESC_KSU=$(escape_mdv2 "${KSU_ENABLED}")
          ESC_SUSFS=$(escape_mdv2 "${SUSFS_ENABLED}")
          ESC_KPM=$(escape_mdv2 "${KPM_ENABLED}")
          ESC_ZRAM=$(escape_mdv2 "${ZRAM}")
          ESC_URL=$(escape_mdv2 "${RUN_URL}")

          CAPTION=$(cat <<EOF
          *Resukisu Kernel — LG V60 (timelm)*
          *Branch:* \`${ESC_BRANCH}\`
          *KSU:* \`${ESC_KSU}\`  *SUSFS:* \`${ESC_SUSFS}\`  *KPM:* \`${ESC_KPM}\`
          *ZRAM:* \`${ESC_ZRAM}\`
          *Zip:* \`${ESC_FILE}\`
          🔗 [Actions run](${ESC_URL})

          ⚠️ 刷入前请备份 boot 分区。
          EOF
          )

          http_code=$(curl -s -o /tmp/tg_resp.txt -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${ZIP_FILE}" \
            --form-string "caption=${CAPTION}" \
            -F "parse_mode=MarkdownV2")

          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
            echo "Telegram upload OK"
          else
            echo "Telegram upload failed: HTTP $http_code"
            sed -n '1,200p' /tmp/tg_resp.txt || true
          fi
