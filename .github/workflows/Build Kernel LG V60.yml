name: Build Kernel LG V60

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Repository'
        required: true
        default: 'wTNTw/Resukisu-LG_V60'
        type: string
      kernel_branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'lineage-23.2'
        type: string
      device:
        description: 'Target Device Codename'
        required: true
        default: 'timelm'
        type: choice
        options:
          - timelm
          - nethunter
      ksu:
        description: 'Enable KernelSU (ReSukiSU-SuSFS)'
        required: true
        type: boolean
        default: true
      kpm:
        description: 'Kernel Module Implementation (KPM/KPN/N/A)'
        required: true
        type: choice
        default: 'KPM'
        options:
          - KPM
          - KPN
          - N/A
      re_kernel:
        description: 'Enable Re:Kernel?'
        required: true
        type: boolean
        default: true
      netfilter:
        description: 'Enable Network Extensions (NETFILTER)?'
        required: true
        type: boolean
        default: true
      build_time:
        description: 'Custom Build Time (F=UTCT or -1=disable)'
        required: false
        type: string
        default: ''
      suffix:
        description: 'Custom Kernel Suffix (empty=random or -1=disable)'
        required: false
        type: string
        default: ''
      ccm:
        description: 'Enable Network Congestion Control (BBRv1+ECN)? (SAFE)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_branch }}
          fetch-depth: 1
      
      - name: Download Build Script
        run: |
          curl -LO https://raw.githubusercontent.com/wTNTw/Action-Build/ReSukiSU/build.sh
          chmod +x build.sh
          echo "=== Downloaded build.sh ==="
          ls -lh build.sh
      
      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3
      
      - name: Setup Cache (ccache)
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache_mikernel
          key: kernel-ccache-ecs-${{ inputs.device }}-${{ inputs.script }}-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-ecs-${{ inputs.device }}-${{ inputs.script }}-
            kernel-ccache-ecs-${{ inputs.device }}-
            kernel-ccache-ecs-
      
      - name: Download and Extract Android NDK
        run: |
          curl -LO https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip "android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/*"
          mkdir -p $HOME/toolchain
          mv android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/* $HOME/toolchain/
          rm -rf android-ndk-r27c-linux.zip android-ndk-r27c
      
      - name: Install ccache-ECS
        run: |
          curl -L -o /tmp/ccache-ecs.zip https://github.com/cctv18/ccache-ECS/releases/download/ccache-ECS-v1.0/linux-x86_64-musl-static-binary.zip
          unzip -o /tmp/ccache-ecs.zip -d /tmp/ccache-ecs
          sudo install -m 755 /tmp/ccache-ecs/ccache /usr/bin/ccache
          echo "=== ccache (ECS) version ==="
          ccache --version
      
      - name: Build Kernel
        env:
          KPM_OPTION: ${{ inputs.kpm }}
          RE_KERNEL: ${{ inputs.re_kernel }}
          NETFILTER: ${{ inputs.netfilter }}
          BUILD_TIME: ${{ inputs.build_time }}
          SUFFIX: ${{ inputs.suffix }}
          CCM: ${{ inputs.ccm }}
        run: |
          echo "=== Kernel Source Verification ==="
          ls -la arch/arm64/configs/ | grep defconfig || echo "ERROR: No defconfig found!"
          
          echo "=== Building Kernel ==="
          if [ "${{ inputs.ksu }}" == "true" ]; then
            echo "Building with KernelSU..."
            bash build.sh ${{ inputs.device }} ksu
          else
            echo "Building without KernelSU..."
            bash build.sh ${{ inputs.device }}
          fi
      
      - name: Download ReSukiSU Manager APK
        if: ${{ inputs.ksu }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Downloading ReSukiSU Manager APK ==="
          
          MANAGER_BRANCH="main"
          MANAGER_ARTIFACT="Manager-release"
          
          echo "Querying latest successful build on branch: $MANAGER_BRANCH"
          run_id=$(gh api "repos/ReSukiSU/ReSukiSU/actions/workflows/build-manager.yml/runs?branch=$MANAGER_BRANCH&status=success&event=push&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "")
          
          if [[ -z "$run_id" ]]; then
            echo "WARN: No successful workflow run found. Skipping APK download."
            exit 0
          fi
          
          echo "Found run ID: $run_id"
          artifact_url=$(gh api "repos/ReSukiSU/ReSukiSU/actions/runs/$run_id/artifacts" 2>/dev/null | jq -r ".artifacts[] | select(.name == \"$MANAGER_ARTIFACT\") | .archive_download_url" | head -n1)
          
          if [[ -z "$artifact_url" ]]; then
            echo "WARN: No artifact '$MANAGER_ARTIFACT' found in run $run_id. Skipping."
            exit 0
          fi
          
          echo "Downloading artifact from: $artifact_url"
          if curl -fL -H "Authorization: token $GITHUB_TOKEN" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url" 2>/dev/null; then
            echo "Extracting APK..."
            
            if unzip -l "${MANAGER_ARTIFACT}.zip" 2>/dev/null | grep -q "arm64-v8a.*\.apk"; then
              echo "Found arm64-v8a APK"
              unzip -j "${MANAGER_ARTIFACT}.zip" "*arm64-v8a*.apk" -d ./anykernel/ 2>/dev/null
            else
              echo "Extracting generic APK"
              unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d ./anykernel/ 2>/dev/null
            fi
            
            rm -f "${MANAGER_ARTIFACT}.zip"
            
            if ls ./anykernel/*.apk 1> /dev/null 2>&1; then
              echo "✓ ReSukiSU Manager APK downloaded successfully"
              ls -lh ./anykernel/*.apk
            else
              echo "WARN: APK extraction failed"
            fi
          else
            echo "WARN: Download failed. Continuing without APK."
          fi
      
      - name: Prepare Artifact Content
        run: |
          rm -rf anykernel/.git
          echo "=== Artifact content ==="
          ls -la anykernel/
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: AnyKernel3_${{ inputs.ksu && format('ReSukiSU_{0}', env.KSUVER) || 'NoKernelSU' }}_LG_V60
          path: anykernel/*
          if-no-files-found: error

      - name: Prepare Telegram Assets
        if: success()
        id: prepare_tg
        run: |
          ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n1 || echo "")
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in workspace root. Trying anykernel/..."
            ZIP_FILE=$(ls -1 anykernel/*.zip 2>/dev/null | head -n1 || echo "")
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No kernel zip found for Telegram publish"
            exit 1
          fi
          ZIP_NAME=$(basename "$ZIP_FILE")
          echo "TELEGRAM_ZIP=${ZIP_FILE}" >> "$GITHUB_OUTPUT"
          echo "TELEGRAM_ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "✅ Found kernel zip: ${ZIP_FILE}"

      - name: Publish to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ZIP: ${{ steps.prepare_tg.outputs.TELEGRAM_ZIP }}
          TELEGRAM_ZIP_NAME: ${{ steps.prepare_tg.outputs.TELEGRAM_ZIP_NAME }}
          KSUVER: ${{ env.KSUVER }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set. Skipping Telegram publish."
            exit 0
          fi

          KERNEL_FILE="$TELEGRAM_ZIP"
          if [ ! -f "$KERNEL_FILE" ]; then
            echo "Kernel zip not found: $KERNEL_FILE"
            exit 0
          fi

          BUILD_DATE_BEIJING=$(TZ='Asia/Shanghai' date +"%a %b %d %T %Z %Y")
          DEVICE="${{ inputs.device }}"
          BRANCH="${{ github.ref_name }}"

          escape_mdv2() {
            printf '%s' "$1" | perl -pe 's{([_*\[\]()~`>#+=|{}.!-])}{\\$1}g'
          }

          ESC_ZIP=$(escape_mdv2 "${TELEGRAM_ZIP_NAME}")
          ESC_DEVICE=$(escape_mdv2 "${DEVICE}")
          ESC_KSU=$(escape_mdv2 "${KSUVER:-NoKernelSU}")
          ESC_DATE=$(escape_mdv2 "${BUILD_DATE_BEIJING}")
          ESC_BRANCH=$(escape_mdv2 "${BRANCH}")

          MESSAGE=$(cat <<EOF
          *ReSukiSU — LG V60* (${ESC_BRANCH})
          *Device:* \`${ESC_DEVICE}\`
          *KSU version:* \`${ESC_KSU}\`
          *Build Date:* \`${ESC_DATE}\`
          📦 \`${ESC_ZIP}\`

          ⚠️ 提示：
          • 刷入前请务必备份 boot 等关键分区。
          • 遇到问题请在群内回复本消息并附上日志。
          EOF
          )

          http_code=$(curl -s -o /tmp/telegram_resp.txt -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${KERNEL_FILE}" \
            --form-string "caption=${MESSAGE}" \
            -F "parse_mode=MarkdownV2")

          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
            echo "✅ Telegram 发送成功"
          else
            echo "❌ Telegram 发送失败，HTTP code: $http_code"
            sed -n '1,200p' /tmp/telegram_resp.txt || true
          fi
