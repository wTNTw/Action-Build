name: Workflow and Cache Cleanup — Faster

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        type: choice
        description: '清理的工作流名称'
        required: true
        default: 'Build All OnePlus Kernels'
        options:
          - Build All OnePlus Kernels
          - Build TEST
          - Build TEST2
      cache_mode:
        type: choice
        description: '缓存清理类型'
        required: false
        default: 'none'
        options:
          - none
          - all
          - ccache
          - apt-cache
          - thinlto-cache
      count:
        description: '最多处理的运行条数（0 = 不限制，所有状态均计数）'
        required: false
        default: '0'
      delete_failed:
        description: '删除指定工作流失败的运行记录？'
        required: false
        type: boolean
        default: false
      delete_success:
        description: '删除指定工作流成功的运行记录？'
        required: false
        type: boolean
        default: false
      delete_cancelled:
        description: '删除指定工作流取消的运行记录？'
        required: false
        type: boolean
        default: false
      reverse_order:
        description: '从旧到新开始清理？'
        required: false
        type: boolean
        default: false
      cancel_all:
        description: '是否一键取消指定工作流的所有运行？'
        required: false
        type: boolean
        default: false
      target_run_numbers:
        description: '按运行编号删除（逗号分隔，纯数字）'
        required: false
        default: ''
      target_run_ids:
        description: '按 Run-ID 删除（逗号分隔，纯数字）'
        required: false
        default: ''
      self_cleanup:
        description: '是否同时清理本工作流（Cleanup 自身）的历史记录？'
        required: false
        type: boolean
        default: true
      release_mode:
        type: choice
        description: '发行版(Release)清理类型'
        required: false
        default: 'none'
        options:
          - none
          - all
          - keep-latest
      release_keep_count:
        description: '保留最近 N 个发行版（release_mode=keep-latest 时生效，0 等同 all）'
        required: false
        default: '3'
      release_delete_tags:
        description: '删除发行版时一并删除对应的 git tag？'
        required: false
        type: boolean
        default: true
      release_orphan_tags:
        description: '同时清理没有对应发行版的孤儿 tag？'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: cleanup-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.cache_mode != 'none' || inputs.self_cleanup || inputs.cancel_all || inputs.delete_failed || inputs.delete_success || inputs.delete_cancelled || inputs.target_run_numbers != '' || inputs.target_run_ids != '' || inputs.release_mode != 'none' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      WORKFLOW_NAME: ${{ inputs.workflow_name }}
      COUNT: ${{ inputs.count }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          fetch-depth: 1

      - name: Validate inputs
        env:
          TARGET_RUN_NUMBERS: ${{ inputs.target_run_numbers }}
          TARGET_RUN_IDS: ${{ inputs.target_run_ids }}
        run: bash scripts/cleanup-runs.sh validate

      - name: Delete by Run Number / Run ID
        if: ${{ inputs.target_run_numbers != '' || inputs.target_run_ids != '' }}
        env:
          TARGET_RUN_NUMBERS: ${{ inputs.target_run_numbers }}
          TARGET_RUN_IDS: ${{ inputs.target_run_ids }}
        run: bash scripts/cleanup-runs.sh delete-by-target

      - name: Cancel all active runs
        if: ${{ inputs.cancel_all }}
        run: bash scripts/cleanup-runs.sh cancel-active

      - name: Batch delete by conclusion
        if: ${{ inputs.target_run_numbers == '' && inputs.target_run_ids == '' && (inputs.delete_failed || inputs.delete_success || inputs.delete_cancelled) }}
        env:
          DELETE_FAILED: ${{ inputs.delete_failed }}
          DELETE_SUCCESS: ${{ inputs.delete_success }}
          DELETE_CANCELLED: ${{ inputs.delete_cancelled }}
          REVERSE_ORDER: ${{ inputs.reverse_order }}
        run: bash scripts/cleanup-runs.sh delete-by-conclusion

      - name: Clean caches by mode
        if: ${{ inputs.cache_mode != 'none' }}
        uses: actions/github-script@v9
        env:
          MODE: ${{ inputs.cache_mode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.MODE;
            const rules = {
              'all': () => true,
              'ccache': k => k.startsWith('ccache-'),
              'apt-cache': k => k.includes('apt-cache') || k.startsWith('apt-'),
              'thinlto-cache': k => k.startsWith('thinlto-'),
            };
            const match = rules[mode];

            // 先一次性取完所有缓存，再删除（边翻页边删会导致后续页被跳过）
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList, { owner, repo, per_page: 100 });
            const hit = caches.filter(c => match(c.key));
            console.log(`🔹 模式 ${mode}：共 ${caches.length} 个缓存，匹配 ${hit.length} 个`);

            let ok = 0, fail = 0;
            for (let i = 0; i < hit.length; i += 10) {
              const rs = await Promise.allSettled(hit.slice(i, i + 10).map(c =>
                github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: c.id })));
              rs.forEach((r, j) => {
                if (r.status === 'fulfilled') ok++;
                else { fail++; console.log(`删除失败: ${hit[i + j].key} (${r.reason.message})`); }
              });
            }
            require('fs').appendFileSync(`${process.env.RUNNER_TEMP}/cleanup-rows.md`, `| 缓存清理 (${mode}) | ${ok} | ${fail} |\n`);

      - name: Clean releases and tags
        if: ${{ inputs.release_mode != 'none' }}
        uses: actions/github-script@v9
        env:
          MODE: ${{ inputs.release_mode }}
          KEEP_RAW: ${{ inputs.release_keep_count }}
          DELETE_TAGS: ${{ inputs.release_delete_tags }}
          ORPHAN_TAGS: ${{ inputs.release_orphan_tags }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.MODE;
            const deleteTags = process.env.DELETE_TAGS === 'true';
            const sweepOrphans = process.env.ORPHAN_TAGS === 'true';

            let keepCount = 0;
            if (mode === 'keep-latest') {
              keepCount = Number(process.env.KEEP_RAW);
              if (!Number.isInteger(keepCount) || keepCount < 0) {
                throw new Error(`❌ release_keep_count 必须为非负整数，当前值: '${process.env.KEEP_RAW}'`);
              }
            }
            console.log(`🔹 发行版清理模式: ${mode}（保留 ${keepCount} 个 / 删 tag: ${deleteTags} / 孤儿 tag: ${sweepOrphans}）`);

            // listReleases 按 created_at 倒序返回，"最近 N 个"即前 N 项。
            // 先取全量快照再逐个删除，避免边删边分页导致漏删。
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
              (response) => response.data
            );
            const allReleaseTags = new Set(releases.map((r) => r.tag_name));
            const targets = mode === 'all' ? releases : releases.slice(keepCount);

            console.log(`共 ${releases.length} 个发行版，本次删除 ${targets.length} 个，保留 ${releases.length - targets.length} 个。`);

            let deletedReleases = 0;
            let deletedTags = 0;
            let orphanDeleted = 0;
            let failed = 0;

            for (const rel of targets) {
              try {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
                deletedReleases++;
                console.log(`✅ 已删除发行版: ${rel.tag_name}`);
              } catch (err) {
                failed++;
                console.log(`❌ 删除发行版失败: ${rel.tag_name} (${err.message})`);
                continue;
              }
              if (!deleteTags) continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${rel.tag_name}` });
                deletedTags++;
              } catch (err) {
                // 404/422 表示该 tag 已不存在或不可删除，视为正常跳过，不计失败。
                if (err.status === 404 || err.status === 422) {
                  console.log(`ℹ️ tag 已不存在或不可删除，跳过: ${rel.tag_name}`);
                } else {
                  failed++;
                  console.log(`❌ 删除 tag 失败: ${rel.tag_name} (${err.message})`);
                }
              }
            }

            // 孤儿 tag = 不属于当前任何发行版的 tag 引用（含仓库里的历史遗留 tag）
            if (sweepOrphans) {
              const refs = await github.paginate(
                github.rest.git.listMatchingRefs,
                { owner, repo, ref: 'tags/', per_page: 100 },
                (response) => response.data
              );
              for (const item of refs) {
                const name = item.ref.replace('refs/tags/', '');
                if (allReleaseTags.has(name)) continue;
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `tags/${name}` });
                  orphanDeleted++;
                  console.log(`✅ 已删除孤儿 tag: ${name}`);
                } catch (err) {
                  failed++;
                  console.log(`❌ 删除孤儿 tag 失败: ${name} (${err.message})`);
                }
              }
              console.log(`孤儿 tag 处理完成，共删除 ${orphanDeleted} 个。`);
            }

            const okTotal = deletedReleases + deletedTags + orphanDeleted;
            require('fs').appendFileSync(
              `${process.env.RUNNER_TEMP}/cleanup-rows.md`,
              `| 发行版清理 (${mode}) | ${okTotal} | ${failed} |\n`);
            console.log(`发行版清理完成：删除 ${deletedReleases} 个发行版、${deletedTags} 个 tag、${orphanDeleted} 个孤儿 tag，失败 ${failed} 个。`);

      - name: Clean this workflow's own run history
        if: ${{ always() && inputs.self_cleanup }}
        run: bash scripts/cleanup-runs.sh self-history

      - name: Write summary
        if: ${{ always() }}
        run: bash scripts/cleanup-runs.sh summary